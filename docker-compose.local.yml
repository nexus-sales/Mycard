# docker-compose para pruebas locales completas sin Dokploy/Traefik
# Ejecutar con: docker compose -f docker-compose.local.yml up --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=${APP_URL:-http://localhost:3000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mycard}:${POSTGRES_PASSWORD:-local_dev_password_123}@postgres:5432/${POSTGRES_DB:-mycard}?schema=public
      - SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME:-sid}
      - SESSION_DURATION_SECONDS=604800
      - UPLOAD_DIR=/app/uploads
      - GOOGLE_WALLET_ISSUER_ID=${GOOGLE_WALLET_ISSUER_ID:-}
      - GOOGLE_WALLET_SERVICE_ACCOUNT_JSON=${GOOGLE_WALLET_SERVICE_ACCOUNT_JSON:-}
    volumes:
      - local_uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - local_net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mycard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-mycard}
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mycard} -d ${POSTGRES_DB:-mycard}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    # Base de datos sin puertos expuestos al exterior en local
    networks:
      - local_net

volumes:
  local_postgres_data:
  local_uploads_data:

networks:
  local_net:
    driver: bridge
